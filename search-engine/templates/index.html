<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next-Gen Browser</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Tab Bar -->
    <div id="tab-bar-container">
        <div id="tabs-list">
            <!-- Tabs will be injected here -->
        </div>
        <button id="new-tab-button" title="New Tab">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        </button>
        <button id="new-incognito-tab-button" title="New Incognito Tab">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
            </svg>
        </button>
    </div>

    <!-- Header / Controls -->
    <header id="controls">
        <div class="nav-group">
            <button id="back-button" class="nav-button" title="Back" disabled>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 18l-6-6 6-6" />
                </svg>
            </button>
            <button id="forward-button" class="nav-button" title="Forward" disabled>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 18l6-6-6-6" />
                </svg>
            </button>
            <button id="reload-button" class="nav-button" title="Reload">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 4v6h-6M1 20v-6h6" />
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />
                </svg>
            </button>
            <button id="home-button" class="nav-button" title="Home">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                    <polyline points="9 22 9 12 15 12 15 22" />
                </svg>
            </button>
        </div>

        <div class="address-container">
            <div class="search-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </div>
            <input type="text" id="address-bar" placeholder="Search the web or enter URL..." spellcheck="false"
                autocomplete="off" />
        </div>

        <div class="menu-group">
            <div class="menu-container">
                <button id="menu-button" class="nav-button menu-toggle" title="Menu">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="1"></circle>
                        <circle cx="12" cy="5" r="1"></circle>
                        <circle cx="12" cy="19" r="1"></circle>
                    </svg>
                </button>
                <div id="dropdown-menu" class="dropdown-menu">
                    <div class="menu-item" id="menu-new-incognito">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <span>New Incognito Tab</span>
                    </div>
                    <div class="menu-item" id="menu-password-manager">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <span>Password Manager</span>
                    </div>
                    <div class="menu-item" id="menu-history">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                        <span>History</span>
                    </div>

                    <div class="menu-item" id="menu-extensions">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"></path>
                            <line x1="16" y1="8" x2="2" y2="22"></line>
                            <line x1="17.5" y1="15" x2="9" y2="15"></line>
                        </svg>
                        <span>Extensions</span>
                    </div>

                    <div class="menu-divider"></div>

                    <div class="menu-item menu-item-toggle" id="menu-adblocker">
                        <div class="menu-item-left">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                            </svg>
                            <span>Ad-Blocker</span>
                            <span id="adblocker-badge" class="badge">0</span>
                        </div>
                        <label class="toggle-switch">
                            <input type="checkbox" id="adblocker-toggle" checked>
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                </div>


            </div>
            <div class="user-info">
                <span id="username-display">Guest</span>
            </div>
            <button id="logout-button" class="nav-button" title="Logout">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main id="browser-content">
        <!-- Tab contents will be injected here -->
    </main>

    <!-- Templates for JS to use -->
    <template id="welcome-screen-template">
        <div class="welcome-screen">
            <div class="welcome-content">
                <div class="logo-container">
                    <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                        stroke-linecap="round" stroke-linejoin="round" class="logo-icon">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="2" y1="12" x2="22" y2="12"></line>
                        <path
                            d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z">
                        </path>
                    </svg>
                </div>
                <h1>Welcome to Next-Gen Browser</h1>
                <p class="welcome-subtitle">Secure. Fast. Private.</p>

                <div class="quick-links">
                    <div class="quick-link" onclick="searchFor('latest technology news')">
                        <div class="quick-link-icon">📰</div>
                        <div class="quick-link-text">Tech News</div>
                    </div>
                    <div class="quick-link" onclick="searchFor('weather today')">
                        <div class="quick-link-icon">🌤️</div>
                        <div class="quick-link-text">Weather</div>
                    </div>
                    <div class="quick-link" onclick="searchFor('trending topics')">
                        <div class="quick-link-icon">🔥</div>
                        <div class="quick-link-text">Trending</div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <template id="search-results-template">
        <div class="search-results-container">
            <div class="search-results-header">
                <h2>Search Results</h2>
            </div>
            <div class="search-results-list"></div>
        </div>
    </template>

    <!-- Toast Notification -->
    <div id="toast-container"></div>

    <!-- Loading Indicator -->
    <div id="loading-indicator" style="display: none;">
        <div class="spinner"></div>
    </div>

    <!-- Password Manager Modal -->
    <div id="password-manager-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Password Manager</h2>
                <button id="close-password-manager" class="close-button">×</button>
            </div>
            <div class="modal-body">
                <div class="password-tools">
                    <button id="generate-password-btn" class="secondary-button">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        Generate Password
                    </button>
                </div>
                <div id="password-list" class="password-list">
                    <!-- Passwords injected here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Save Password Modal -->
    <div id="save-password-modal" class="modal">
        <div class="modal-content small">
            <div class="modal-header">
                <h2>Save Password?</h2>
            </div>
            <div class="modal-body">
                <p>Do you want to save the password for <strong id="save-site-name">site</strong>?</p>
                <div class="user-preview">
                    <span class="user-icon">👤</span>
                    <span id="save-username">username</span>
                </div>
                <div class="modal-actions">
                    <button id="save-password-never" class="text-button">Never</button>
                    <button id="save-password-not-now" class="secondary-button">Not Now</button>
                    <button id="save-password-save" class="primary-button">Save</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Password Generator Modal -->
    <div id="password-generator-modal" class="modal">
        <div class="modal-content small">
            <div class="modal-header">
                <h2>Generate Password</h2>
                <button id="close-generator" class="close-button">×</button>
            </div>
            <div class="modal-body">
                <div class="generator-display">
                    <input type="text" id="generated-password" readonly>
                    <button id="copy-generated" title="Copy">📋</button>
                    <button id="refresh-generated" title="Regenerate">🔄</button>
                </div>
                <div class="generator-options">
                    <label>Length: <span id="length-val">16</span></label>
                    <input type="range" id="length-range" min="8" max="32" value="16">
                    <div class="checkbox-group">
                        <label><input type="checkbox" id="use-upper" checked> ABC</label>
                        <label><input type="checkbox" id="use-lower" checked> abc</label>
                        <label><input type="checkbox" id="use-numbers" checked> 123</label>
                        <label><input type="checkbox" id="use-symbols" checked> !@#</label>
                    </div>
                </div>
                <div class="modal-actions">
                    <button id="use-generated-password" class="primary-button">Use Password</button>
                </div>
            </div>
        </div>
    </div>

    <!-- History Modal -->
    <div id="history-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Browsing History</h2>
                <button id="close-history" class="close-button">×</button>
            </div>
            <div class="modal-body">
                <div class="history-tools">
                    <input type="text" id="history-search" placeholder="Search history..." class="search-input">
                    <button id="clear-history-btn" class="secondary-button">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2">
                            </path>
                        </svg>
                        Clear History
                    </button>
                </div>
                <div id="history-list" class="history-list">
                    <!-- History items injected here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Downloads Modal -->
    <div id="downloads-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Downloads</h2>
                <button id="close-downloads" class="close-button">×</button>
            </div>
            <div class="modal-body">
                <div class="downloads-tools">
                    <input type="text" id="downloads-search" placeholder="Search downloads..." class="search-input">
                    <button id="clear-downloads-btn" class="secondary-button">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2">
                            </path>
                        </svg>
                        Clear All
                    </button>
                </div>
                <div id="downloads-list" class="downloads-list">
                    <!-- Downloads items injected here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Extensions Modal -->
    <div id="extensions-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Extensions</h2>
                <button id="close-extensions" class="close-button">×</button>
            </div>
            <div class="modal-body">
                <div class="extensions-tools">
                    <button id="add-extension-btn" class="primary-button">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        Add Extension
                    </button>
                </div>
                <div id="extensions-list" class="extensions-list">
                    <!-- Extensions items injected here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Add Extension Modal -->
    <div id="add-extension-modal" class="modal">
        <div class="modal-content small">
            <div class="modal-header">
                <h2>Add Extension</h2>
                <button id="close-add-extension" class="close-button">×</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="ext-name" class="search-input" placeholder="My Extension">
                </div>
                <div class="form-group">
                    <label>Description (or Prompt)</label>
                    <input type="text" id="ext-desc" class="search-input"
                        placeholder="What should this extension do? e.g. 'Change background to dark mode'">
                </div>

                <div class="form-group" id="ai-generation-group">
                    <button id="generate-code-btn" class="secondary-button" style="width: 100%; margin-bottom: 12px;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M12 2a10 10 0 1 0 10 10H12V2z"></path>
                            <path d="M12 2a10 10 0 0 1 10 10"></path>
                            <path d="M2.05 12a10 10 0 0 1 10-10"></path>
                        </svg>
                        Generate Code with AI
                    </button>
                </div>

                <div class="form-group">
                    <label>JavaScript Code <small>(Generated or Manual)</small></label>
                    <textarea id="ext-code" class="code-input" placeholder="// Your JS code here..."></textarea>
                </div>
                <div class="modal-actions">
                    <button id="save-extension-btn" class="primary-button">Install Extension</button>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/adblocker-manager.js') }}?v=1"></script>
    <script src="{{ url_for('static', filename='js/extensions-manager.js') }}?v=2"></script>
    <script src="{{ url_for('static', filename='js/downloads-manager.js') }}?v=2"></script>
    <script src="{{ url_for('static', filename='js/history-manager.js') }}?v=1"></script>
    <script src="{{ url_for('static', filename='js/password-manager.js') }}?v=4"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}?v=4"></script>


</body>

</html>
