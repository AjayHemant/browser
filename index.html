<!-- index.html -->
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Next-Gen Browser</title>
    <!-- Basic styling for the browser UI -->
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #controls {
            display: flex;
            align-items: center;
            padding: 10px 8px;
            background-color: #07181d;
            border-bottom: 1px solid #ccc;
            gap: 8px; /* Adds space between control elements */
        }
        .nav-button {
            background: none;
            border: none;
            font-size: 20px;
            color: #e0e0e0;
            cursor: pointer;
            padding: 0 8px;
            border-radius: 4px;
            line-height: 1;
            transition: background-color 0.2s;
        }
        .nav-button:hover {
            background-color: #2c3e50;
        }
        .nav-button:disabled {
            color: #6c757d;
            cursor: not-allowed;
            background: none;
        }
        #address-bar {
            flex: 1;
            padding: 6px 12px;
            font-size: 15px;
            border: 1px solid #343a40;
            border-radius: 20px; /* Rounded address bar */
            background-color: #212529;
            color: #f8f9fa;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        #address-bar:focus {
            outline: none;
            border-color: #495057;
            box-shadow: none;
        }
        #webview-container {
            flex: 1;
            position: relative; /* Required for the webview */
        }
        webview {
            position: absolute;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div id="controls">
        <button id="back-button" class="nav-button" title="Back" disabled>&larr;</button>
        <button id="forward-button" class="nav-button" title="Forward" disabled>&rarr;</button>
        <button id="reload-button" class="nav-button" title="Reload">&#x21bb;</button>
        <input type="text" id="address-bar" placeholder="Search or enter address" />
    </div>

    <!-- The webview tag is where the external web content will be displayed -->
    <div id="webview-container">
        <webview id="webview" src="https://www.google.com"></webview>
    </div>

    <script src="./renderer.js"></script>
</body>
</html>
